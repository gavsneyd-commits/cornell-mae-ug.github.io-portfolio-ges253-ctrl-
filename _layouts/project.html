---
layout: default
---

<article class="project-page">

<h1>{{ page.title }}</h1>

{% unless page.hide_image %}
<p><img src="{{ page.image | relative_url }}" alt="{{ page.imagealt | default: page.title }}" class="project-image" /></p>
{% endunless %}

{{ content }}

{% if page.technologies and page.technologies.size > 0 %}
<p class="tech"><strong>Technologies Used</strong>: {{ page.technologies | join: ", " }}</p>
{% endif %}

<a href="{{ "/projects/" | relative_url }}" class="back-arrow">&larr; Back to Projects</a>

</article>
