<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} – {{ site.name }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">
      <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true"><span></span></label>
      <nav class="site-nav" aria-label="Main">
        <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ "/" | relative_url }}">Home</a>
        <a class="nav-link {% if page.url contains '/projects/' %}active{% endif %}" href="{{ "/projects/" | relative_url }}">Projects</a>
        <a class="nav-link {% if page.url == '/cv/' %}active{% endif %}" href="{{ "/cv/" | relative_url }}">CV</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <div class="container">
      &copy; 2026 {{ site.name }}
    </div>
  </footer>

</body>
</html>
